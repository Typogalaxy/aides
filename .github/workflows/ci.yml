name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify packaging scripts
        run: |
          for script in scripts/macos/{aides-service,package.sh,appcast.sh,release.sh}; do
            bash -n "$script"
          done
          plutil -lint scripts/macos/Info.plist
      - name: Run package tests
        run: swift test
      - name: Smoke-test the server with isolated local fixtures
        run: |
          swift build --product AidesServer
          binary="$(swift build --show-bin-path)/AidesServer"
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/aides-server-smoke.XXXXXX")"
          install -m 0755 "$binary" "$smoke_dir/AidesServer"
          codesign --force --sign - "$smoke_dir/AidesServer"
          for fixture in server toolkit-commands toolkit-local toolkit-mail; do
            python3 -u "scripts/test-${fixture}.py" "$smoke_dir/AidesServer"
          done
      - name: Build development DMG, including the updater
        env:
          AIDES_ENABLE_SPARKLE: '1'
        run: scripts/macos/package.sh
      - name: Upload development DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-development
          path: dist/*-development.dmg
          if-no-files-found: error
          retention-days: 7
